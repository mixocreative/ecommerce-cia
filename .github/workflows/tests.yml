name: tests
on: [push, pull_request]
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # untested.py reads the doctrine history
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.2", extensions: openssl, curl }
      - name: PHP lint (fixture + tools)
        run: find tests/fixture-shop tools -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: NewebPay tools
        run: python tests/test_newebpay_tools.py
      - name: ECPay tools (offline)
        run: python tests/test_ecpay_tools.py
      - name: LINE Pay tools (offline)
        run: python tests/test_linepay_tools.py
      - name: PAYUNi + TapPay tools (offline)
        run: python tests/test_payuni_tappay_tools.py
      - name: Gate and doctrine-tested guard (score.py --gate, untested.py, their tests)
        run: |
          python tools/score.py --gate
          python tools/untested.py
          python -m unittest discover -s tests -p 'test_score_gate.py'
          python -m unittest discover -s tests -p 'test_untested.py'
      - name: Structure, size and receipts (check_structure.py and its tests, receipts.py --gate)
        run: |
          python tools/check_structure.py
          python -m unittest discover -s tests -p 'test_check_structure.py'
          python -m unittest discover -s tests -p 'test_audit_report.py'
          python tools/receipts.py --gate
          python tools/check_key_lines.py
      # In tools/pre-push too, but a hook is per clone and optional.
      - name: Taiwanese Chinese, not mainland usage
        run: python tools/zh_check.py --gate
      - name: First contact (every tool answers --help without running its job)
        run: python tests/test_cli_help.py
      - name: Lint (ruff over tools/ and the test scripts, as cia lints its own)
        run: pip install ruff==0.11.9 && ruff check tools/ tests/*.py
      - name: Skill frontmatter sanity
        run: |
          python - <<'PY'
          import re,sys
          t=open('SKILL.md',encoding='utf-8').read()
          m=re.match(r'---\nname: (\S+)\ndescription: "(.*)"\n---\n',t,re.S)
          assert m, 'frontmatter shape'
          assert len(m.group(2))<=1024, f'description {len(m.group(2))} chars > 1024'
          print('ok', m.group(1), len(m.group(2)), 'chars')
          PY
